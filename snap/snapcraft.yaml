name: buildtest
adopt-info: buildtest-release-data
summary: Buildtest - remotely build and test, over HTTP
description: |
  Buildtest is a minimal daemon for remote build-and-test jobs. Upload a
  source tree, and the daemon builds it with snapcraft and runs your spread
  tests, streaming output back to the client in real time. When a build
  fails, attach an interactive terminal and debug it in place.

  **Usage**

  You can use the `buildtest` command to:

  * Run the daemon: `buildtest run --http=:8000`
  * Upload source, build it, and run tests: `buildtest build-test <dir> --stream`
  * Inspect build and test runs: `buildtest changes`, `buildtest tasks`
  * Abort a stuck build: `buildtest changes --abort <id>`

  Buildtest stores its state in the directory given by `$BUILDTEST`
  (defaulting to `$HOME/snap/buildtest/<snap_revision>` when installed as
  a snap).

  **Documentation**

  See https://github.com/holmanb/buildtest
issues: https://github.com/holmanb/buildtest/issues
source-code: https://github.com/holmanb/buildtest
license: GPL-3.0
base: bare
build-base: core22
confinement: classic

apps:
  buildtest:
    command: buildtest-wrapper

parts:
  buildtest:
    plugin: go
    source: .
    build-snaps:
      - go/1.26/stable
    # The snap build relies on the cmd/version*.go files within the source path.
    # For proper versioning, run "go generate ./cmd/" before building the snap.
    # If doing a "snapcraft remote-build", ensure you've also run
    # "git add -f ./cmd/VERSION ./cmd/version_generated.go".
    override-build: |
      which go
      go version
      snap info go
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ]; then
        export GOARCH=arm
        export GOARM=6
      fi
      CGO_ENABLED=0 go build -trimpath -ldflags=-w -ldflags=-s -o $CRAFT_PART_INSTALL/bin/buildtest ./cmd/buildtest

  buildtest-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(${CRAFT_STAGE}/bin/buildtest version --client)"

      # Set snap version
      craftctl set version="$version"

      # Buildtest releases are semantically versioned and have a "v" prefix
      [[ "${version}" == *"git"* ]] && grade=devel || grade=stable
      craftctl set grade="$grade"
    after: [buildtest]

  # Dump the buildtest-wrapper into the snap.
  buildtest-wrapper:
    plugin: dump
    source: ./snap/local
